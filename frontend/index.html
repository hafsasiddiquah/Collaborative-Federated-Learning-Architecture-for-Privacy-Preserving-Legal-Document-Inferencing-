<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Legal FL Frontend</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        textarea { width: 100%; height: 200px; }
        button { padding: 10px 20px; margin: 10px 0; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Legal Document Summarization</h1>
    <textarea id="inputText" placeholder="Enter legal document text here..."></textarea>
    <button onclick="summarize()">Summarize</button>
    <div id="result"></div>

    <script>
        async function summarize() {
            const text = document.getElementById('inputText').value;
            if (!text) {
                alert('Please enter text to summarize.');
                return;
            }
            try {
                const response = await fetch('http://localhost:8000/summarize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer default-token'  // Use the API token
                    },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                document.getElementById('result').innerText = data.summary || 'Error: ' + data.detail;
            } catch (error) {
                document.getElementById('result').innerText = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
